<h1>Products</h1>

<div class="products-container">

  @for (product of products; track product.id) {

    <div class="product-card">

      <img [src]="product.image" [alt]="product.title">

      <h2>{{ product.title }}</h2>

      <p class="price">
        {{ product.price | currency }}
      </p>

      <p>
        {{ product.description }}
      </p>

    </div>

  }

</div>
