<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Users API</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <button id="allUsers">
            All Users
        </button>

        <table id="usersTable">

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Website</th>
                    <th>City</th>
                    <th>Company</th>
                </tr>

            </thead>

            <tbody id="usersBody">
            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>

</html>
