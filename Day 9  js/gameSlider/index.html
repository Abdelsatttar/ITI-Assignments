<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Slide Show Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>
        <span>Slide Show</span> Game
    </h1>

    <div class="slider">

        <img id="image" src="https://tse1.mm.bing.net/th/id/OIP.ckqUPFmJ_2hBF5YR7ec5nQHaEI?r=0&rs=1&pid=ImgDetMain&o=7&rm=3">

    </div>

    <div class="buttons">

        <button id="previous">&lt;</button>

        <button id="play">Play</button>

        <button id="stop">Stop</button>

        <button id="next">&gt;</button>

    </div>

    <script src="script.js"></script>

</body>

</html>
