<div class="container py-5">

  <!-- Title -->

  <div class="text-center mb-5">

    <h1 class="fw-bold">
      Our Products
    </h1>

    <p class="text-muted">
      Choose your favorite watch
    </p>

  </div>


  <!-- Filter -->

  <div class="row justify-content-center mb-5">

    <div class="col-md-4">

      <label
        for="category"
        class="form-label fw-semibold">

        Filter by Category

      </label>

      <select
        id="category"
        class="form-select"
        [formControl]="selectedCategory">

        <option value="all">
          All
        </option>

        <option value="sport">
          Sport
        </option>

        <option value="classic">
          Classic
        </option>

        <option value="luxury">
          Luxury
        </option>

      </select>

    </div>

  </div>


  <!-- Products -->

  <div class="row g-4">

    @for (product of filteredProducts(); track product.id) {

      <div class="col-sm-6 col-lg-3">

        <div class="card h-100 border-0 shadow-sm">

          <!-- Image -->

          <div class="p-3 text-center">

            <img
              [src]="product.image"
              [attr.alt]="product.name"
              class="card-img-top"
              style="height: 200px; object-fit: contain;">

          </div>


          <!-- Body -->

          <div class="card-body d-flex flex-column">

            <h5 class="card-title fw-bold">
              {{ product.name }}
            </h5>


            <p
              class="fw-bold fs-5"
              [style.color]="product.price > 100 ? 'red' : 'green'">

              ${{ product.price }}

            </p>


            <!-- Stock -->

            <span
              class="badge align-self-start mb-3"
              [class.bg-success]="product.inStock"
              [class.bg-danger]="!product.inStock">

              {{ product.inStock ? 'In Stock' : 'Out of Stock' }}

            </span>


            <!-- Button -->

            <button
              class="btn btn-dark mt-auto"
              (click)="addToCart(product.name)"
              [disabled]="!product.inStock">

              Add to Cart

            </button>

          </div>

        </div>

      </div>

    }

    @empty {

      <div class="col-12 text-center">

        <div class="alert alert-warning">

          No products found.

        </div>

      </div>

    }

  </div>

</div>
