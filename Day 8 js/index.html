<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Lab Tasks</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <section class="task-section">
        <h2>Task 1: Profile Card</h2>
        <div id="profile-card" class="card">
            <h3>Student Name: <span id="display-name">Ahmed</span></h3>
            <p>Student Age: <span id="display-age">20</span></p>
        </div>
        <div class="inputs-container">
            <input type="text" id="input-name" placeholder="Enter new name">
            <input type="number" id="input-age" placeholder="Enter new age">
            <button id="update-btn">Update Profile</button>
        </div>
    </section>


    <section class="task-section">
        <h2>Task 2: Light / Dark Mode</h2>
        <p>This is a paragraph to test dark mode.</p>
        <button id="toggle-btn">Toggle Dark/Light Mode</button>
    </section>


    <section class="task-section">
        <h2>Task 3: Image Gallery</h2>
        <div class="img-container">
        
            <img id="my-image" src="" alt="Gallery Image">
        </div>
        <button id="btn-cat">Show Cat</button>
        <button id="btn-dog">Show Dog</button>
        <button id="btn-remove">Remove Image</button>
    </section>

    
    <section class="task-section">
        <h2>Task 5: Product Card Generator</h2>
        <button id="add-product-btn">Add Product</button>
        <div id="products-container"></div>
    </section>

   
    <script src="main.js"></script>
</body>
</html>
